<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>WorkLog – Shift Tracker</title>
  <meta name="theme-color" content="#080b12" id="themeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── DARK THEME (default) ── */
    :root, [data-theme="dark"] {
      --bg: #080b12;
      --bg2: #0e1120;
      --bg3: #0a0d18;
      --border: #1a1f35;
      --border2: #161b2e;
      --text: #dde2f0;
      --text2: #7a85a8;
      --muted: #3a4060;
      --accent: #00b4d8;
      --accent2: #00d4ff;
      --green: #00e676;
      --red: #ff3d6a;
      --card-shadow: 0 2px 12px rgba(0,0,0,.4);
      --toggle-bg: #1a1f35;
      --toggle-knob: #00d4ff;
    }

    /* ── LIGHT THEME ── */
    [data-theme="light"] {
      --bg: #f0f4f8;
      --bg2: #ffffff;
      --bg3: #f7fafc;
      --border: #dde3ee;
      --border2: #e8edf5;
      --text: #1a2035;
      --text2: #5a6585;
      --muted: #9aa3be;
      --accent: #0077b6;
      --accent2: #0096c7;
      --green: #00a651;
      --red: #e63950;
      --card-shadow: 0 2px 12px rgba(0,0,0,.08);
      --toggle-bg: #dde3ee;
      --toggle-knob: #0096c7;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Sora', system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
    ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; outline: none; }
    select option { background: var(--bg2); color: var(--text); }

    /* ── Toggle Switch ── */
    .theme-toggle { display: flex; align-items: center; gap: 8px; }
    .toggle-track { width: 44px; height: 24px; background: var(--toggle-bg); border-radius: 12px; position: relative; cursor: pointer; transition: background .25s; border: 1.5px solid var(--border); flex-shrink: 0; }
    .toggle-knob { width: 18px; height: 18px; background: var(--toggle-knob); border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: transform .25s, background .25s; }
    [data-theme="light"] .toggle-knob { transform: translateX(20px); background: var(--accent2); }
    .toggle-icon { font-size: 15px; line-height: 1; }

    /* ── Buttons ── */
    .btn { border: none; border-radius: 11px; padding: 11px 20px; font-weight: 600; font-size: 14px; transition: all .15s; }
    .btn-p { background: linear-gradient(135deg, #00b4d8, #0077b6); color: #fff; }
    .btn-p:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn-p:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-g { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
    .btn-g:hover { border-color: var(--accent2); color: var(--text); }
    .btn-d { background: rgba(255,61,106,.08); color: var(--red); border: 1.5px solid rgba(255,61,106,.2); }
    .btn-d:hover { background: rgba(255,61,106,.15); }
    .btn-sm { padding: 6px 13px; font-size: 12px; border-radius: 8px; }

    /* ── Inputs ── */
    .inp { width: 100%; background: var(--bg3); border: 1.5px solid var(--border); border-radius: 11px; padding: 11px 14px; color: var(--text); font-size: 14px; transition: border .15s, background .25s; }
    .inp:focus { border-color: var(--accent2); }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator { filter: var(--cal-icon, invert(0.5)); }
    [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator,
    [data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }
    #header { background: var(--bg); border-bottom: 1px solid var(--border2); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; transition: background .25s; }
    #body { flex: 1; max-width: 660px; margin: 0 auto; width: 100%; padding: 20px 14px 96px; }
    #nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border2); display: flex; justify-content: space-around; padding: 7px 0 env(safe-area-inset-bottom, 14px); z-index: 40; transition: background .25s; }
    .nav-btn { background: none; border: none; padding: 9px 14px; border-radius: 10px; color: var(--muted); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all .15s; min-width: 72px; }
    .nav-btn.active { color: var(--accent2); background: rgba(0,212,255,.08); }
    .nav-btn .icon { font-size: 22px; line-height: 1; }

    /* ── Cards ── */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--card-shadow); transition: background .25s, border .25s; }
    .stat-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 18px 12px; text-align: center; box-shadow: var(--card-shadow); transition: background .25s; }
    .shift-row { background: var(--bg3); border: 1px solid var(--border2); border-radius: 13px; padding: 13px 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 11px; box-shadow: var(--card-shadow); transition: background .25s; }
    .wcard { background: var(--bg3); border: 1px solid var(--border2); border-radius: 14px; padding: 15px; margin-bottom: 9px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; box-shadow: var(--card-shadow); transition: background .25s; }

    /* ── Tags ── */
    .tag-on  { background: rgba(0,230,118,.1);  color: var(--green); border: 1px solid rgba(0,230,118,.25); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .tag-off { background: rgba(255,83,112,.1); color: var(--red);   border: 1px solid rgba(255,83,112,.25); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }

    /* ── Modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
    @media (min-width: 580px) { .overlay { align-items: center; } }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 22px; width: 100%; max-width: 440px; padding: 26px; animation: slideUp .2s ease; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); transition: background .25s; }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── Misc ── */
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin-bottom: 13px; }
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; color: #fff; }
    .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 22px; font-size: 13px; font-weight: 600; z-index: 100; white-space: nowrap; animation: slideUp .2s ease; box-shadow: 0 8px 32px rgba(0,0,0,.2); pointer-events: none; }
    .sync-bar { background: rgba(0,212,255,.1); border-bottom: 1px solid rgba(0,212,255,.2); padding: 6px 20px; font-size: 11px; color: var(--accent2); font-weight: 600; text-align: center; letter-spacing: .5px; }
    .preview-box { background: rgba(0,212,255,.06); border: 1px solid rgba(0,212,255,.2); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .flex-row { display: flex; align-items: center; gap: 7px; margin-bottom: 20px; flex-wrap: wrap; }
    .pill-btn { border: 1.5px solid var(--border); background: transparent; color: var(--text2); border-radius: 8px; padding: 6px 13px; font-size: 12px; font-weight: 600; font-family: inherit; transition: all .15s; cursor: pointer; }
    .pill-btn.active { border-color: var(--accent2); color: var(--accent2); }
    .form-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: block; }
    .form-group { display: flex; flex-direction: column; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
    .hidden { display: none !important; }
    .header-left { display: flex; flex-direction: column; }
    .header-right { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
<div id="app">
  <div id="syncBar" class="sync-bar hidden">⟳ Saving data...</div>

  <div id="header">
    <div class="header-left">
      <div style="font-size:10px;font-weight:800;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase">WorkLog</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-.3px">Shift Tracker</div>
    </div>
    <div class="header-right">
      <!-- Theme Toggle -->
      <div class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">
        <span class="toggle-icon">☀️</span>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
        <span class="toggle-icon">🌙</span>
      </div>
      <button class="btn btn-g btn-sm" onclick="loadAll()" id="refreshBtn">↻</button>
      <button class="btn btn-p btn-sm" onclick="openLogShift()">+ Log Shift</button>
    </div>
  </div>

  <div id="body">
    <!-- Dashboard -->
    <div id="view-dashboard">
      <div class="flex-row">
        <button class="pill-btn active" data-period="all" onclick="setPeriod('all')">All Time</button>
        <button class="pill-btn" data-period="week" onclick="setPeriod('week')">This Week</button>
        <button class="pill-btn" data-period="month" onclick="setPeriod('month')">This Month</button>
      </div>
      <div class="grid-3" id="statBoxes"></div>
      <div class="section-label">Workers</div>
      <div id="dashWorkers"></div>
      <button class="btn btn-g" style="width:100%;margin-top:8px;display:none" id="exportBtn" onclick="exportCSV()">⬇ Export to CSV</button>
    </div>

    <!-- Shifts -->
    <div id="view-shifts" class="hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap">
        <div class="section-label" style="margin:0" id="shiftCount">Shift History</div>
        <select class="inp" style="width:auto;font-size:12px;padding:6px 10px" id="filterWorkerSel" onchange="filterWorker=this.value;renderShifts()">
          <option value="all">All workers</option>
        </select>
      </div>
      <div id="shiftList"></div>
      <button class="btn btn-g" style="width:100%;margin-top:8px;display:none" id="exportBtn2" onclick="exportCSV()">⬇ Export to CSV</button>
    </div>

    <!-- Workers -->
    <div id="view-workers" class="hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div class="section-label" style="margin:0" id="workerCount">Workers</div>
        <button class="btn btn-p btn-sm" onclick="openAddWorker()">+ Add Worker</button>
      </div>
      <div id="workerList"></div>
    </div>
  </div>

  <div id="nav">
    <button class="nav-btn active" data-view="dashboard" onclick="setView('dashboard')"><span class="icon">📊</span><span>Summary</span></button>
    <button class="nav-btn" data-view="shifts" onclick="setView('shifts')"><span class="icon">📋</span><span>Shifts</span></button>
    <button class="nav-btn" data-view="workers" onclick="setView('workers')"><span class="icon">👥</span><span>Workers</span></button>
  </div>
</div>

<!-- Add Worker Modal -->
<div id="modalWorker" class="overlay hidden" onclick="closeModal('modalWorker')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Add Worker</div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input class="inp" id="wName" placeholder="e.g. Jordan Smith" onkeydown="if(event.key==='Enter')saveWorker()" />
      </div>
      <div class="form-group">
        <label class="form-label">Hourly Rate (optional)</label>
        <input class="inp" id="wRate" type="number" step="0.01" placeholder="e.g. 28.50" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-g" style="flex:1" onclick="closeModal('modalWorker')">Cancel</button>
        <button class="btn btn-p" style="flex:2" onclick="saveWorker()">Add Worker</button>
      </div>
    </div>
  </div>
</div>

<!-- Log Shift Modal -->
<div id="modalShift" class="overlay hidden" onclick="closeModal('modalShift')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Log a Shift</div>
    <div id="shiftModalBody"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script>
// ── JSONBin Config ─────────────────────────────────────
const API_KEY  = "$2a$10$l1CovBrK8fTRY.s1fgyYquacI.jahkvmAXyd0QXVeUHAW/st8OPwe";
const BASE_URL = "https://api.jsonbin.io/v3/b";
const HEADERS  = { "Content-Type":"application/json", "X-Master-Key":API_KEY, "X-Bin-Meta":"false" };
let BIN_ID = localStorage.getItem("worklog_bin_id") || null;

let workers = [], shifts = [];
let currentView = "dashboard", currentPeriod = "all", filterWorker = "all";
let toastTimer = null;

// ── Theme ──────────────────────────────────────────────
let theme = localStorage.getItem("worklog_theme") || "dark";
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeColor").content = t === "dark" ? "#080b12" : "#f0f4f8";
  localStorage.setItem("worklog_theme", t);
}
function toggleTheme() { applyTheme(theme === "dark" ? "light" : "dark"); }
applyTheme(theme);

// ── Utils ──────────────────────────────────────────────
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
function timeToMins(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function fmtDur(m) { m=Number(m); const h=Math.floor(m/60),r=m%60; return h>0?`${h}h${r>0?` ${r}m`:""}` :`${r}m`; }
function fmtDate(d) { try { return new Date(d).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}); } catch(e){ return d; } }
function avatarColor(n) { return `hsl(${(n||"?").charCodeAt(0)*47%360},55%,45%)`; }
function wById(id) { return workers.find(w=>w.id===id); }
function escHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function setSyncing(on) { document.getElementById("syncBar").classList.toggle("hidden",!on); }

function notify(msg, type="ok") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.color = type==="err" ? "var(--red)" : "var(--green)";
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.add("hidden"), 2800);
}

// ── JSONBin API ────────────────────────────────────────
async function createBin() {
  const res = await fetch(BASE_URL, {
    method:"POST",
    headers:{ ...HEADERS, "X-Bin-Name":"worklog-data", "X-Bin-Private":"true" },
    body: JSON.stringify({ workers:[], shifts:[] })
  });
  const data = await res.json();
  const id = data.metadata?.id || data.id;
  localStorage.setItem("worklog_bin_id", id);
  BIN_ID = id;
  return id;
}

async function readBin() {
  const res = await fetch(`${BASE_URL}/${BIN_ID}/latest`, { headers: HEADERS });
  return res.json();
}

async function writeBin(data) {
  await fetch(`${BASE_URL}/${BIN_ID}`, {
    method:"PUT", headers: HEADERS, body: JSON.stringify(data)
  });
}

// ── Load ───────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById("refreshBtn");
  btn.innerHTML = '<span class="spin">↻</span>';
  try {
    if (!BIN_ID) await createBin();
    const data = await readBin();
    workers = Array.isArray(data.workers) ? data.workers : [];
    shifts  = Array.isArray(data.shifts)  ? data.shifts  : [];
    renderAll(); populateWorkerFilter(); notify("Loaded ✓");
  } catch(e) {
    try {
      if (!BIN_ID) await createBin();
      const data = await readBin();
      workers = Array.isArray(data.workers) ? data.workers : [];
      shifts  = Array.isArray(data.shifts)  ? data.shifts  : [];
      renderAll(); populateWorkerFilter(); notify("Loaded ✓");
    } catch(e2) { notify("Could not connect. Check internet.", "err"); }
  }
  btn.innerHTML = "↻";
}

async function save() {
  setSyncing(true);
  await writeBin({ workers, shifts });
  setSyncing(false);
}

// ── Filtered ───────────────────────────────────────────
function getFiltered() {
  let s = [...shifts];
  if (filterWorker !== "all") s = s.filter(x=>x.workerId===filterWorker);
  if (currentPeriod === "week")  s = s.filter(x=>Date.now()-new Date(x.date)<7*86400000);
  if (currentPeriod === "month") s = s.filter(x=>Date.now()-new Date(x.date)<30*86400000);
  return s.sort((a,b)=>b.date.localeCompare(a.date));
}

// ── Render ─────────────────────────────────────────────
function renderAll() { renderDashboard(); renderShifts(); renderWorkers(); }

function renderDashboard() {
  const fs = getFiltered();
  const totalMins = fs.reduce((a,s)=>a+Number(s.duration),0);
  const totalPay  = fs.reduce((a,s)=>{ const w=wById(s.workerId); return a+(w?.rate||0)*(Number(s.duration)/60); },0);

  document.getElementById("statBoxes").innerHTML = [
    {icon:"📋", val:fs.length,                     label:"Shifts"},
    {icon:"⏱",  val:(totalMins/60).toFixed(1)+"h", label:"Hours"},
    {icon:"💵",  val:"$"+totalPay.toFixed(2),        label:"Est. Pay"},
  ].map(s=>`
    <div class="stat-box">
      <div style="font-size:22px;margin-bottom:6px">${s.icon}</div>
      <div class="mono" style="font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.5px">${s.val}</div>
      <div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:3px">${s.label}</div>
    </div>`).join("");

  const wStats = workers.map(w=>{
    const ws=fs.filter(s=>s.workerId===w.id);
    const mins=ws.reduce((a,s)=>a+Number(s.duration),0);
    return {...w,count:ws.length,mins,pay:(mins/60)*(w.rate||0)};
  });

  document.getElementById("dashWorkers").innerHTML = wStats.length===0
    ? `<div class="empty">No workers yet — go to Workers tab to add your crew.</div>`
    : wStats.map(w=>`
      <div class="card" style="margin-bottom:9px;padding:13px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:11px">
            <div class="avatar" style="width:38px;height:38px;font-size:14px;background:${avatarColor(w.name)}">${w.name[0].toUpperCase()}</div>
            <div>
              <div style="font-weight:600;font-size:14px">${escHtml(w.name)}</div>
              <div style="font-size:11px;color:var(--muted)">${w.count} shift${w.count!==1?"s":""} · ${fmtDur(w.mins)}${!w.active?` <span style="color:var(--red)">· inactive</span>`:""}</div>
            </div>
          </div>
          <div style="text-align:right">
            <div class="mono" style="font-weight:700;font-size:17px;color:${w.rate>0?"var(--green)":"var(--muted)"}">
              ${w.rate>0?"$"+w.pay.toFixed(2):"—"}
            </div>
            ${w.rate>0?`<div style="font-size:11px;color:var(--muted)">$${w.rate}/hr</div>`:""}
          </div>
        </div>
      </div>`).join("");

  document.getElementById("exportBtn").style.display = fs.length>0 ? "block" : "none";
}

function renderShifts() {
  const fs = getFiltered();
  document.getElementById("shiftCount").textContent = `Shift History (${fs.length})`;
  document.getElementById("exportBtn2").style.display = fs.length>0 ? "block" : "none";
  document.getElementById("shiftList").innerHTML = fs.length===0
    ? `<div class="empty">No shifts logged yet.</div>`
    : fs.map(s=>{
        const w=wById(s.workerId);
        const pay=w?((Number(s.duration)/60)*(w.rate||0)):0;
        return `
        <div class="shift-row">
          <div class="avatar" style="width:34px;height:34px;font-size:13px;background:${w?avatarColor(w.name):"var(--border)"}">
            ${w?w.name[0].toUpperCase():"?"}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px">${w?escHtml(w.name):"Unknown"}</div>
            <div style="font-size:11px;color:var(--text2)">${fmtDate(s.date)} · ${s.startTime}–${s.endTime} · ${fmtDur(s.duration)}</div>
            ${s.notes&&s.notes!=="undefined"?`<div style="font-size:11px;color:var(--accent);margin-top:2px">${escHtml(s.notes)}</div>`:""}
          </div>
          <div style="text-align:right;flex-shrink:0">
            ${pay>0?`<div class="mono" style="font-size:14px;font-weight:700;color:var(--green)">$${pay.toFixed(2)}</div>`:""}
            <button class="btn btn-d btn-sm" style="margin-top:5px" onclick="deleteShift('${s.id}')">✕</button>
          </div>
        </div>`;
      }).join("");
}

function renderWorkers() {
  document.getElementById("workerCount").textContent = `Workers (${workers.length})`;
  document.getElementById("workerList").innerHTML = workers.length===0
    ? `<div class="empty">No workers yet. Tap + Add Worker to get started.</div>`
    : workers.map(w=>`
      <div class="wcard">
        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
          <div class="avatar" style="width:42px;height:42px;font-size:15px;background:${avatarColor(w.name)}">${w.name[0].toUpperCase()}</div>
          <div style="min-width:0">
            <div style="font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(w.name)}</div>
            <div style="font-size:11px;color:var(--muted)">${w.rate>0?"$"+w.rate+"/hr":"No rate set"}</div>
          </div>
        </div>
        <div style="display:flex;gap:7px;align-items:center;flex-shrink:0;flex-wrap:wrap">
          <span class="${w.active?"tag-on":"tag-off"}">${w.active?"Active":"Off"}</span>
          <button class="btn btn-g btn-sm" onclick="toggleActive('${w.id}')">${w.active?"Deactivate":"Activate"}</button>
          <button class="btn btn-d btn-sm" onclick="removeWorker('${w.id}')">✕</button>
        </div>
      </div>`).join("");
}

function populateWorkerFilter() {
  const sel = document.getElementById("filterWorkerSel");
  const cur = sel.value;
  sel.innerHTML = `<option value="all">All workers</option>` +
    workers.map(w=>`<option value="${w.id}"${w.id===cur?" selected":""}>${escHtml(w.name)}</option>`).join("");
}

// ── Navigation ─────────────────────────────────────────
function setView(v) {
  currentView = v;
  ["dashboard","shifts","workers"].forEach(id=>{
    document.getElementById("view-"+id).classList.toggle("hidden", id!==v);
  });
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===v));
  if (v==="shifts") renderShifts();
}

function setPeriod(p) {
  currentPeriod = p;
  document.querySelectorAll(".pill-btn").forEach(b=>b.classList.toggle("active", b.dataset.period===p));
  renderDashboard();
}

// ── Workers ────────────────────────────────────────────
function openAddWorker() {
  document.getElementById("wName").value = "";
  document.getElementById("wRate").value = "";
  document.getElementById("modalWorker").classList.remove("hidden");
  setTimeout(()=>document.getElementById("wName").focus(), 150);
}

async function saveWorker() {
  const name = document.getElementById("wName").value.trim();
  const rate = parseFloat(document.getElementById("wRate").value) || 0;
  if (!name) return;
  const w = { id:genId(), name, rate, active:true };
  closeModal("modalWorker");
  workers.push(w);
  renderAll(); populateWorkerFilter();
  await save();
  notify(`${name} added ✓`);
}

async function toggleActive(id) {
  const w = wById(id); if (!w) return;
  w.active = !w.active;
  renderAll(); await save();
}

async function removeWorker(id) {
  const w = wById(id);
  if (!confirm(`Remove ${w?.name}? Their shift history is kept.`)) return;
  workers = workers.filter(x=>x.id!==id);
  renderAll(); populateWorkerFilter();
  await save(); notify(`${w?.name} removed`, "err");
}

// ── Shifts ─────────────────────────────────────────────
function openLogShift() {
  const active = workers.filter(w=>w.active);
  const today  = new Date().toISOString().split("T")[0];
  document.getElementById("shiftModalBody").innerHTML = active.length===0
    ? `<div style="text-align:center;padding:16px 0">
        <div style="font-size:14px;color:var(--muted);margin-bottom:14px">No active workers. Add someone first.</div>
        <button class="btn btn-p" onclick="closeModal('modalShift');openAddWorker();setView('workers')">Add Worker</button>
       </div>`
    : `<div style="display:flex;flex-direction:column;gap:14px">
        <div class="form-group">
          <label class="form-label">Worker *</label>
          <select class="inp" id="sWorker" onchange="updatePreview()">
            <option value="">Select worker...</option>
            ${active.map(w=>`<option value="${w.id}">${escHtml(w.name)}</option>`).join("")}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date *</label>
          <input class="inp" id="sDate" type="date" value="${today}" onchange="updatePreview()" />
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Start</label>
            <input class="inp" id="sStart" type="time" value="09:00" onchange="updatePreview()" />
          </div>
          <div class="form-group">
            <label class="form-label">End</label>
            <input class="inp" id="sEnd" type="time" value="17:00" onchange="updatePreview()" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Notes (optional)</label>
          <input class="inp" id="sNotes" placeholder="e.g. covered lunch shift" />
        </div>
        <div id="shiftPreview" class="preview-box" style="display:none"></div>
        <div class="modal-actions">
          <button class="btn btn-g" style="flex:1" onclick="closeModal('modalShift')">Cancel</button>
          <button class="btn btn-p" style="flex:2" onclick="saveShift()">Save Shift</button>
        </div>
       </div>`;
  document.getElementById("modalShift").classList.remove("hidden");
  setTimeout(updatePreview, 50);
}

function updatePreview() {
  const start = document.getElementById("sStart")?.value;
  const end   = document.getElementById("sEnd")?.value;
  const wId   = document.getElementById("sWorker")?.value;
  const prev  = document.getElementById("shiftPreview");
  if (!prev||!start||!end) return;
  let dur = timeToMins(end) - timeToMins(start);
  if (dur<=0) dur+=1440;
  const w = wById(wId);
  const pay = w?.rate ? ((dur/60)*w.rate).toFixed(2) : null;
  prev.style.display = "block";
  prev.innerHTML = `<span style="color:var(--accent2);font-weight:600">Duration: ${fmtDur(dur)}</span>${pay?`<span style="color:var(--green);margin-left:14px;font-weight:600">Est. pay: $${pay}</span>`:""}`;
}

async function saveShift() {
  const wId   = document.getElementById("sWorker").value;
  const date  = document.getElementById("sDate").value;
  const start = document.getElementById("sStart").value;
  const end   = document.getElementById("sEnd").value;
  const notes = document.getElementById("sNotes").value || "";
  if (!wId||!date) return;
  let dur = timeToMins(end) - timeToMins(start);
  if (dur<=0) dur+=1440;
  const s = { id:genId(), workerId:wId, date, startTime:start, endTime:end, duration:dur, notes };
  closeModal("modalShift");
  shifts.push(s); renderAll();
  await save(); notify("Shift saved ✓");
}

async function deleteShift(id) {
  if (!confirm("Delete this shift?")) return;
  shifts = shifts.filter(x=>x.id!==id);
  renderShifts(); renderDashboard();
  await save(); notify("Shift deleted", "err");
}

// ── Export ─────────────────────────────────────────────
function exportCSV() {
  const fs = getFiltered();
  const rows = [["Worker","Date","Start","End","Hours","Rate ($/hr)","Pay ($)","Notes"]];
  fs.forEach(s=>{
    const w=wById(s.workerId);
    rows.push([w?.name||"?", s.date, s.startTime, s.endTime,
      (Number(s.duration)/60).toFixed(2), w?.rate||0,
      ((Number(s.duration)/60)*(w?.rate||0)).toFixed(2), s.notes||""]);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = `worklog_${new Date().toISOString().split("T")[0]}.csv`;
  a.click(); notify("CSV exported!");
}

function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

// ── Boot ───────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
